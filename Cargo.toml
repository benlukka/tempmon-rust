[package]
name = "tempmonrustserver"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.4.0", features = ["postgres", "serde_json", "r2d2", "chrono"] }
poem-openapi = { version = "5.1.16", features = ["swagger-ui", "chrono"] }
tokio = { version = "1.54.1", features = ["full"] }
log = "0.4.35"
diesel_migrations = "2.4.0"
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }
serde_json = "1.0.154"
env_logger = "0.11.11"
mdns-sd = "0.21.7"
chrono = "0.4.45"
poem = "3.1.12"
md5 = "0.8.1"

[lints.clippy]
unwrap_used = "deny"